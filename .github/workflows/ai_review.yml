name: AI Code Review (GitHub Models)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read          # Permissão obrigatória para o GitHub Models

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache do nitpik
        uses: actions/cache@v4
        with:
          path: ~/.config/nitpik/cache
          key: nitpik-${{ github.repository }}
          save-always: true

      - name: Executar revisão com nitpik
        uses: nsrosenqvist/nitpik@v1
        with:
          profiles: backend,security
          fail_on: warning
          scan_secrets: "true"
        env:
          NITPIK_PROVIDER: github
          NITPIK_MODEL: openai/gpt-4.1-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}