name: AI Code Review (GitHub Models)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache do nitpik
        uses: actions/cache@v4
        with:
          path: ~/.config/nitpik/cache
          key: nitpik-${{ github.repository }}
          save-always: true

      - name: Executar revisão com nitpik
        uses: nsrosenqvist/nitpik@v2.2.0
        with:
          # Perfis válidos: backend, security, architect e critic.
          # 'critic' ativa o painel que revê e filtra os achados dos outros perfis.
          profiles: backend,security,critic
          # Modo agente desativado para evitar excesso de chamadas e rate limit.
          agent: "false"
          # fail_on: error mantém warnings visíveis sem bloquear o merge.
          fail_on: error
          scan_secrets: "true"
          # Timeout maior e contexto de commit reduzido para diminuir carga.
          args: "--timeout 600 --no-commit-context"
        env:
          NITPIK_PROVIDER: github
          NITPIK_MODEL: openai/gpt-4.1-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}