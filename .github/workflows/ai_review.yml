
name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache nitpik
        uses: actions/cache@v4
        with:
          path: ~/.config/nitpik/cache
          key: nitpik-${{ runner.os }}-${{ github.repository }}
          restore-keys: |
            nitpik-${{ runner.os }}-${{ github.repository }}-

      - name: Run nitpik
        id: nitpik
        uses: nsrosenqvist/nitpik@v2.2.0
        with:
          version: v2.2.0
          profiles: backend,security
          diff_base: origin/${{ github.base_ref }}
          scan_secrets: "true"
          agent: "false"
          fail_on: error
        env:
          NITPIK_PROVIDER: github
          NITPIK_MODEL: openai/gpt-4.1-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NITPIK_AUDIT_LOG: nitpik-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitpik-audit-report
          path: nitpik-audit.json
          if-no-files-found: ignore
          retention-days: 5
